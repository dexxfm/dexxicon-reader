<!doctype html>
<!--
  issue #330: app store header, rendered to app-store-header-5244x2950.png. The page is laid
  out at 2622x1475 CSS px and rendered at device scale factor 2:

  chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2
    --window-size=2622,1475 --virtual-time-budget=8000
    --screenshot=app-store-header-5244x2950.png app-store-header.html

  The icon is icon.svg's artwork (the centred store icon) on the app icon's rounded tile.
-->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
  :root {
    --navy-top: #17263F; --navy-bottom: #0F1B31; --tile: #152238;
    --outline: #C7CED9; --text: #E7EBF1; --muted: #9AA4B4; --aqua: #57C9B4;
  }
  html, body { margin: 0; width: 2622px; height: 1475px; overflow: hidden; }
  body {
    background:
      radial-gradient(860px 860px at 610px 737px, rgba(87, 201, 180, 0.10), transparent 70%),
      linear-gradient(135deg, var(--navy-top), var(--navy-bottom));
    font-family: "Archivo", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    display: grid; grid-template-columns: 820px 1fr; align-items: center;
    column-gap: 150px; padding-inline: 200px 170px; box-sizing: border-box;
  }
  .icon {
    width: 820px; height: 820px; border-radius: 180px; overflow: hidden;
    box-shadow: 0 60px 140px rgba(0, 0, 0, 0.45), 0 0 0 3px rgba(199, 206, 217, 0.10);
  }
  .icon svg { display: block; width: 100%; height: 100%; }
  .copy { display: grid; gap: 54px; }
  .eyebrow { font-weight: 600; font-size: 62px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--aqua); }
  h1 { margin: 0; font-weight: 800; font-size: 214px; line-height: 0.98; letter-spacing: -0.02em; }
  h1 .aqua { color: var(--aqua); }
  h1 .nowrap { white-space: nowrap; }
  p { margin: 0; font-size: 70px; line-height: 1.3; color: var(--muted); max-width: 1320px; text-wrap: balance; }
</style></head>
<body>
  <div class="icon">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
      <rect width="108" height="108" fill="#152238"/>
      <!-- the fox, scaled up 1.25 about the tile centre (centred mark from icon.svg) -->
      <g transform="translate(54 54) scale(1.25) translate(-54 -54)"><g transform="translate(0,-9.85)">
        <path fill="#8A94A6" d="M48,74 h12 v24 l-6,-7 -6,7 Z"/>
        <path fill="#57C9B4" d="M33,61 C35,71 43,79 54,79 C65,79 73,71 75,61 C67,67 61,70 54,70 C47,70 41,67 33,61 Z"/>
        <path fill="none" stroke="#C7CED9" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"
              d="M54,80 C42,80 34,71 32,60 L28,32 L44,44 C50,41 58,41 64,44 L80,32 L76,60 C74,71 66,80 54,80 Z"/>
        <circle cx="46.85" cy="55" r="2.35" fill="#9AA4B4"/>
        <circle cx="61.15" cy="55" r="2.35" fill="#9AA4B4"/>
        <path fill="#9AA4B4" d="M51.3,61.15 h5.4 l-2.7,2.75 Z"/>
      </g></g>
    </svg>
  </div>
  <div class="copy">
    <div class="eyebrow">Dexxicon Reader</div>
    <h1><span class="nowrap">Books done</span><br><span class="aqua">your way.</span></h1>
    <p>Books, comics and audiobooks from your own server, on every screen.</p>
  </div>
</body></html>

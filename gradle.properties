org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Android Studio JBR (JDK 17+). Override in ~/.gradle/gradle.properties if your JDK differs.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
ksp.useKSP2=true

# iOS Kotlin/Native targets can't build on Windows/Linux hosts — don't warn about it
# on every configure. They still build on the macOS CI runner.
kotlin.native.ignoreDisabledTargets=true

# issue #371 — an installable Android debug APK for pull requests, so a PR can be tried on a device
# without building it locally.
#
#   - Every PR push builds that PR.
#   - "Run workflow" (Actions tab) builds one PR (enter its number) or, left blank, every open,
#     non-draft PR at once, one job each.
#   - "Run workflow" with "combine" ticked rebuilds the release/dev branch (main plus every open,
#     non-draft PR merged in) and builds one APK from it.
#
# Each APK is attached to the run (14 days) as dexxicon-pr<N>-<sha>.apk and linked from a comment
# on its PR. Security: the build jobs run the PR's own code, so they get a read-only token and no
# secrets; only the comment job can write, and it never checks out PR code. Tests run after the
# APK is saved, so a failing test still leaves a build to try.
name: PR dev build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to build (leave blank for every open, non-draft PR)"
        required: false
        default: ""
      combine:
        description: "Instead, rebuild release/dev (main + every open PR) and build one APK from it"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || format('manual-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  targets:
    name: Pick the PRs to build
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          THIS_PR: ${{ github.event.pull_request.number }}
          THIS_SHA: ${{ github.event.pull_request.head.sha }}
          ASKED: ${{ inputs.pr }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            prs="[{\"pr\":$THIS_PR,\"sha\":\"$THIS_SHA\"}]"
          elif [ -n "$ASKED" ]; then
            prs=$(gh pr view "$ASKED" --repo "$GITHUB_REPOSITORY" --json number,headRefOid \
              --jq '[{pr: .number, sha: .headRefOid}]')
          else
            prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
              --json number,headRefOid,isDraft \
              --jq '[.[] | select(.isDraft | not) | {pr: .number, sha: .headRefOid}]')
          fi
          echo "Building: $prs"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  android:
    name: "Android debug APK · PR #${{ matrix.pr }}"
    needs: targets
    if: needs.targets.outputs.prs != '' && needs.targets.outputs.prs != '[]' && !inputs.combine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.prs) }}
    steps:
      # The PR's own commits (its head), the same whichever way the run started.
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ matrix.pr }}/head
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # gradle.properties pins the owner's Windows JDK; a user-level property wins over it.
      # Every PR build signs with the one CI debug key (.github/ci on main), so a newer build
      # installs over an older one. It's a plain debug key with the standard "android" password —
      # never used for releases. Taken from main, so PRs branched before it existed get it too.
      - name: Point Gradle at this JDK; use the shared CI debug key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.gradle ~/.android
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties
          if [ -f .github/ci/debug.keystore ]; then
            cp .github/ci/debug.keystore ~/.android/debug.keystore
          else
            gh api "repos/$GITHUB_REPOSITORY/contents/.github/ci/debug.keystore?ref=${{ github.event.repository.default_branch }}" \
              -H "Accept: application/vnd.github.raw" > ~/.android/debug.keystore
          fi

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Name the APK after the PR and commit
        id: apk
        run: |
          name="dexxicon-pr${{ matrix.pr }}-$(echo '${{ matrix.sha }}' | cut -c1-7)"
          cp app/build/outputs/apk/debug/app-debug.apk "$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach the APK to the run
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}.apk
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        env:
          NAME: ${{ steps.apk.outputs.name }}
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### PR #${{ matrix.pr }}: [$NAME]($URL)"
            echo
            echo "Download, unzip and install. A debug build (\`.debug\` app id), so it installs beside the store app."
            echo "Signed with the shared CI debug key: it updates earlier PR builds, but not a debug build made on your own machine (uninstall that first)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests
        run: >-
          ./gradlew testDebugUnitTest :core:data:testAndroidHostTest :core:serverapi:testAndroidHostTest
          :core:model:jvmTest --console=plain

  # Rebuilds release/dev: main with every open, non-draft PR merged in, in PR order, force-pushed.
  # A throwaway preview branch for trying the open PRs together: no PR targets it and nothing is
  # built on top of it. This is the only job that can push, and it never builds or runs PR code:
  # merging is git alone. A PR that doesn't merge cleanly is skipped, and so is one that changes
  # .github/workflows (GitHub won't let the workflow's own token push workflow changes).
  integrate:
    name: Rebuild release/dev
    needs: targets
    if: inputs.combine && needs.targets.outputs.prs != '' && needs.targets.outputs.prs != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: release-dev
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      base: ${{ steps.merge.outputs.base }}
      included: ${{ steps.merge.outputs.included }}
      skipped: ${{ steps.merge.outputs.skipped }}
      workflows: ${{ steps.merge.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Merge the open PRs into a fresh release/dev
        id: merge
        env:
          PRS: ${{ needs.targets.outputs.prs }}
        run: |
          git config user.name "PR dev build"
          git config user.email "pr-dev-build@users.noreply.github.com"
          git checkout -q -B release/dev
          base=$(git rev-parse --short HEAD)
          included=""; skipped=""; workflows=""
          for pr in $(echo "$PRS" | jq -r '.[].pr' | sort -n); do
            git fetch -q origin "+refs/pull/$pr/head:refs/remotes/pr/$pr"
            if [ -n "$(git diff --name-only "HEAD...pr/$pr" -- .github/workflows)" ]; then
              workflows="$workflows #$pr"
              continue
            fi
            if git merge -q --no-edit -m "release/dev: merge PR #$pr" "pr/$pr"; then
              included="$included #$pr"
            else
              git merge --abort
              skipped="$skipped #$pr"
            fi
          done
          git push -q --force origin release/dev
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "base=$base"
            echo "included=${included# }"
            echo "skipped=${skipped# }"
            echo "workflows=${workflows# }"
          } >> "$GITHUB_OUTPUT"
          echo "release/dev = main ($base) +${included:- nothing}; conflicts:${skipped:- none}; workflow changes:${workflows:- none}"

  # Builds the APK from the exact release/dev commit just pushed. Read-only, like the per-PR builds.
  combined:
    name: Android debug APK · release/dev
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Point Gradle at this JDK; use the shared CI debug key
        run: |
          mkdir -p ~/.gradle ~/.android
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties
          # On main once #371 is merged; until then the runner's own debug key signs it.
          if [ -f .github/ci/debug.keystore ]; then cp .github/ci/debug.keystore ~/.android/debug.keystore; fi

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Name the APK
        id: apk
        env:
          SHA: ${{ needs.integrate.outputs.sha }}
        run: |
          name="dexxicon-release-dev-$(date -u +%Y%m%d-%H%M)-$(echo "$SHA" | cut -c1-7)"
          cp app/build/outputs/apk/debug/app-debug.apk "$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach the APK to the run
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}.apk
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          NAME: ${{ steps.apk.outputs.name }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          SHA: ${{ needs.integrate.outputs.sha }}
          BASE: ${{ needs.integrate.outputs.base }}
          INCLUDED: ${{ needs.integrate.outputs.included }}
          SKIPPED: ${{ needs.integrate.outputs.skipped }}
          WORKFLOWS: ${{ needs.integrate.outputs.workflows }}
        run: |
          {
            if [ -n "$URL" ]; then echo "### release/dev debug APK: [$NAME]($URL)"; else echo "### release/dev build failed"; fi
            echo
            echo "- Branch: [\`release/dev\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/release/dev) at \`${SHA:0:7}\`, from \`main\` at $BASE"
            echo "- Merged in: ${INCLUDED:-none}"
            echo "- Skipped, didn't merge cleanly: ${SKIPPED:-none}"
            echo "- Skipped, changes workflow files: ${WORKFLOWS:-none}"
            echo
            echo "A throwaway preview of the open PRs together; rebuilt (force-pushed) each run. A build failure with nothing skipped means two PRs don't compile together."
          } >> "$GITHUB_STEP_SUMMARY"

  # Writes only: links each PR's APK in a comment on that PR (one comment, updated each run). It
  # never checks out PR code. On a fork's own push GitHub hands out a read-only token, so those
  # comments come from a manual run instead; the run summary has the links either way.
  comment:
    name: Link the APKs on their PRs
    needs: [targets, android]
    if: >-
      always() && needs.targets.outputs.prs != '' && needs.targets.outputs.prs != '[]' && !inputs.combine &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          PRS: ${{ needs.targets.outputs.prs }}
        with:
          script: |
            const marker = '<!-- dexxicon-pr-build -->';
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId });
            for (const { pr, sha } of JSON.parse(process.env.PRS)) {
              const name = `dexxicon-pr${pr}-${sha.slice(0, 7)}`;
              const artifact = artifacts.find(a => a.name === name);
              if (!artifact) { core.info(`No APK for PR #${pr} (its build failed?)`); continue; }
              const url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
              const body = `${marker}\n**Debug APK** for ${sha.slice(0, 7)}: [${name}](${url}) (kept 14 days). ` +
                `Download, unzip and install; it updates earlier PR builds.`;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr });
              const mine = comments.find(c => c.body && c.body.startsWith(marker));
              if (mine) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
              }
            }

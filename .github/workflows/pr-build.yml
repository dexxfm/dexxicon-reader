# issue #371 — an installable Android debug APK for every pull request, so a PR can be tried on a
# device without building it locally. The APK is attached to the run (14 days); same-repo PRs also
# get a comment linking it. Tests run after the APK is saved, so a failing test still leaves a
# build to try.
name: PR dev build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # gradle.properties pins the owner's Windows JDK; a user-level property wins over it.
      # Every PR build signs with the one CI debug key (.github/ci), so a newer build installs
      # over an older one. It's a plain debug key with the standard "android" password — never
      # used for releases.
      - name: Point Gradle at this JDK; use the shared CI debug key
        run: |
          mkdir -p ~/.gradle ~/.android
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties
          cp .github/ci/debug.keystore ~/.android/debug.keystore

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Name the APK after the PR and commit
        id: apk
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short=$(echo "$HEAD_SHA" | cut -c1-7)
          name="dexxicon-${PR:+pr$PR-}$short"
          cp app/build/outputs/apk/debug/app-debug.apk "$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach the APK to the run
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}.apk
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        env:
          NAME: ${{ steps.apk.outputs.name }}
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Debug APK: [$NAME]($URL)"
            echo
            echo "Download, unzip and install. It's a debug build (\`.debug\` app id), so it installs beside the store app."
            echo "Signed with the shared CI debug key: it updates earlier PR builds, but not a debug build made on your own machine (uninstall that first)."
          } >> "$GITHUB_STEP_SUMMARY"

      # A fork's PR gets a read-only token, so only same-repo PRs get the comment; the run's
      # summary above has the link either way.
      - name: Link the APK on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          NAME: ${{ steps.apk.outputs.name }}
          URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- dexxicon-pr-build -->';
            const body = `${marker}\n**Debug APK** for ${context.payload.pull_request.head.sha.slice(0, 7)}: ` +
              `[${process.env.NAME}](${process.env.URL}) (kept 14 days). Download, unzip and install; ` +
              `it updates earlier PR builds.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Unit tests
        run: >-
          ./gradlew testDebugUnitTest :core:data:testAndroidHostTest :core:serverapi:testAndroidHostTest
          :core:model:jvmTest --console=plain

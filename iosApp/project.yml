name: iosApp
options:
  bundleIdPrefix: net.dexxicon.reader
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

# issue #101: Readium's Swift Toolkit (readium/swift-toolkit, BSD-3-Clause) — the iOS sibling
# of the Readium Kotlin Toolkit :app already uses on Android. No KMP-shared reading engine
# exists (Readium Kotlin has no iOS target at all — see the "iOS Reading Support" proposal),
# so this is real, separate native Swift, pinned to the current stable release. Deployment
# target above (iOS 16) already clears its minimum (iOS 15).
#
# issue #107: CBR (RAR) comics need the same two-step normalize-to-CBZ Android's
# core/reader/ComicArchiveNormalizer.kt already does (Readium's format sniffing is ZIP-only on
# both toolkits) — Unrar.swift (mtgto, MIT, wraps the same official RARLAB unrar source
# UnrarKit uses) reads the RAR; writing the resulting CBZ reuses readium/ZIPFoundation (the
# exact fork ReadiumSwiftToolkit above already depends on for its own ZIP *reading*, product
# ReadiumZIPFoundation) rather than the upstream weichsel/ZIPFoundation project it forked
# from. A real ios-ci run caught this the hard way: depending on weichsel/ZIPFoundation
# directly fails SPM resolution outright — SwiftPM identifies packages by the git URL's last
# path component, not the org, so weichsel/ZIPFoundation.git and readium/ZIPFoundation.git
# collide as the same package identity with incompatible version constraints. Depending on
# Readium's own fork (same URL/version it already resolves transitively) is the fix.
packages:
  ReadiumSwiftToolkit:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.0
  Unrar:
    url: https://github.com/mtgto/Unrar.swift.git
    exactVersion: 0.5.4
  ZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    exactVersion: 3.0.1

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.dexxicon.reader
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - SharedKit
    dependencies:
      - package: ReadiumSwiftToolkit
        product: ReadiumShared
      - package: ReadiumSwiftToolkit
        product: ReadiumStreamer
      - package: ReadiumSwiftToolkit
        product: ReadiumNavigator
      - package: Unrar
        product: Unrar
      - package: ZIPFoundation
        product: ReadiumZIPFoundation
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

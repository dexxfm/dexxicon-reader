name: Dexxicon
options:
  bundleIdPrefix: net.dexxicon.reader
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

# issue #101: Readium's Swift Toolkit (readium/swift-toolkit, BSD-3-Clause) — the iOS sibling
# of the Readium Kotlin Toolkit :app already uses on Android. No KMP-shared reading engine
# exists (Readium Kotlin has no iOS target at all — see the "iOS Reading Support" proposal),
# so this is real, separate native Swift, pinned to the current stable release. Deployment
# target above (iOS 16) already clears its minimum (iOS 15).
#
# issue #107: CBR (RAR) comics need the same two-step normalize-to-CBZ Android's
# core/reader/ComicArchiveNormalizer.kt already does (Readium's format sniffing is ZIP-only on
# both toolkits) — Unrar.swift (mtgto, MIT, wraps the same official RARLAB unrar source
# UnrarKit uses) reads the RAR; writing the resulting CBZ reuses readium/ZIPFoundation (the
# exact fork ReadiumSwiftToolkit above already depends on for its own ZIP *reading*, product
# ReadiumZIPFoundation) rather than the upstream weichsel/ZIPFoundation project it forked
# from. A real ios-ci run caught this the hard way: depending on weichsel/ZIPFoundation
# directly fails SPM resolution outright — SwiftPM identifies packages by the git URL's last
# path component, not the org, so weichsel/ZIPFoundation.git and readium/ZIPFoundation.git
# collide as the same package identity with incompatible version constraints. Depending on
# Readium's own fork (same URL/version it already resolves transitively) is the fix.
packages:
  ReadiumSwiftToolkit:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.0
  Unrar:
    url: https://github.com/mtgto/Unrar.swift.git
    exactVersion: 0.5.4
  ZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    exactVersion: 3.0.1

targets:
  Dexxicon:
    type: application
    platform: iOS
    sources:
      - path: Dexxicon
    settings:
      base:
        PRODUCT_NAME: Dexxicon
        PRODUCT_BUNDLE_IDENTIFIER: net.dexxicon.reader
        INFOPLIST_FILE: Dexxicon/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        DEVELOPMENT_TEAM: XG622A3783
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - SharedKit
      configs:
        # issue #119: the CarPlay entitlement (com.apple.developer.carplay-audio) needed a
        # manual, case-by-case grant from Apple (requested via developer.apple.com/contact/
        # carplay/) before it could appear in any real provisioning profile. That grant arrived
        # 2026-09-16 and the App ID's CarPlay (Audio) capability is now enabled, so both configs
        # below carry the entitlement — the old Debug-only restriction (and the Release-side
        # "Dexxicon Reader App Store v2" profile not including it) no longer applies; that
        # profile was regenerated the same day against the now-CarPlay-capable App ID.
        # CODE_SIGN_STYLE: Manual here is load-bearing, not decorative — confirmed live
        # (2026-09-16) that Automatic signing silently drops this entitlement even for
        # Simulator's "Sign to Run Locally" identity, because Automatic computes the actual
        # signed entitlements from what DEVELOPMENT_TEAM's account is approved for, not just
        # whatever CODE_SIGN_ENTITLEMENTS points at — `codesign -d --entitlements` on the built
        # app showed an empty dict despite this file being wired up correctly. Manual signing
        # takes the entitlements file at face value with no account-capability filtering.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_ENTITLEMENTS: Dexxicon/Dexxicon.entitlements
        # Release archives (TestFlight/App Store) need a Distribution identity, not Apple
        # Development — automatic signing defaults to a Development profile even when
        # archiving, which then requires a registered device (there are none registered on
        # this team, and App Store distribution doesn't need any). Manual signing here points
        # at the SHA-1 of the "Apple Distribution: Damien Ball (XG622A3783)" certificate
        # specifically (a name-prefix value like "Apple Distribution" gets resolved by Xcode as
        # an alias of the identity class and can silently pick a *different* distribution cert
        # on this team if more than one is present — the hash is the only reliable way to pin
        # one exact cert). issue #250 v1.1.1 release: the previous cert this pointed at
        # (6471802D27...) lived only in a since-lost dedicated CI keychain
        # (~/.dexxiroll-ci/signing.keychain-db, password no longer known) — its identity no
        # longer resolves at all over a fresh SSH session (`security find-identity` against the
        # login keychain doesn't list it), so archiving failed with errSecInternalComponent.
        # Regenerated against this cert (which *is* in the login keychain, confirmed present
        # via `security find-identity -v -p codesigning`) and a matching fresh profile
        # ("Dexxicon Reader App Store v3", created via the App Store Connect API — see
        # [[dexxicon-ios-release-signing]]) instead of chasing the old keychain's password.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: A27705A164006B8657753E96F4AAB1BBF43F5F45
          CODE_SIGN_ENTITLEMENTS: Dexxicon/Dexxicon.entitlements
          PROVISIONING_PROFILE_SPECIFIER: Dexxicon Reader App Store v3
    dependencies:
      - package: ReadiumSwiftToolkit
        product: ReadiumShared
      - package: ReadiumSwiftToolkit
        product: ReadiumStreamer
      - package: ReadiumSwiftToolkit
        product: ReadiumNavigator
      - package: Unrar
        product: Unrar
      - package: ZIPFoundation
        product: ReadiumZIPFoundation
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

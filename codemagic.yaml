# Codemagic CI for Dexxicon Reader.
# https://docs.codemagic.io/yaml/yaml-getting-started/
#
# ── Live now ────────────────────────────────────────────────────────────────
#   android-ci        The §09 invariant: :app assembles (debug + unsigned
#                     release) and every module's unit tests pass. Runs on
#                     every push to `main` and every pull request.
#
# ── Dormant until the iOS port starts (manual-trigger only) ─────────────────
#   android-release   Signed APK + AAB on a v* tag. Needs the `android_signing`
#                     env group. Until then keep cutting releases locally.
#   ios-ci            Shared framework + iosSimulatorArm64 tests + xcodebuild.
#                     Self-skips while `shared/` and `iosApp/` don't exist;
#                     wire `triggering` once Phase 0 lands.
#   ios-testflight    Archive + upload to TestFlight. Needs the App Store
#                     Connect integration and an iOS signing identity.
#
# ── One-time Codemagic UI setup ────────────────────────────────────────────
#   • Applications → Add application → connect this repo. Workflows below then
#     appear automatically.
#   • Notifications: set the recipient in Team settings, or add a
#     `publishing: email:` block per workflow.
#   • android-release: Environment variables → group `android_signing`:
#       KEYSTORE_B64        = base64 of app/release.keystore  (base64 -w0)
#       KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   • ios-*: add the App Store Connect API key integration (Teams → Integrations)
#     and a code-signing identity; put its reference in group `appstore`.

definitions:
  prepare_gradle: &prepare_gradle
    name: Prepare Gradle
    script: |
      # The wrapper's git mode bit doesn't always survive a squash-merge; make it
      # executable here so no workflow depends on it.
      chmod +x ./gradlew
      # gradle.properties pins a Windows JDK path for local dev; override it here.
      mkdir -p "$HOME/.gradle"
      echo "org.gradle.java.home=$JAVA_HOME" >> "$HOME/.gradle/gradle.properties"

  android_sdk: &android_sdk
    name: Install the SDK packages the build pins
    # AGP auto-downloads the compile SDK + build-tools when they're missing and
    # licences are accepted (they are, on Codemagic images). This step is a
    # best-effort pre-fetch — it must never fail the build if sdkmanager isn't
    # on PATH or a package is already present.
    script: |
      SDKMANAGER=$(command -v sdkmanager || true)
      if [ -z "$SDKMANAGER" ]; then
        for d in "$ANDROID_SDK_ROOT" "$ANDROID_HOME"; do
          for c in "$d"/cmdline-tools/*/bin/sdkmanager "$d"/tools/bin/sdkmanager; do
            [ -x "$c" ] && SDKMANAGER="$c" && break 2
          done
        done
      fi
      if [ -n "$SDKMANAGER" ]; then
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" || true
      else
        echo "sdkmanager not found — leaving SDK components to AGP's auto-download."
      fi

  gradle_cache: &gradle_cache
    - $HOME/.gradle/caches
    - $HOME/.gradle/wrapper
    - $HOME/.konan          # Kotlin/Native toolchain — big; cache it for the iOS lane

workflows:

  # ───────────────────────────────────────────────────────────────────────────
  android-ci:
    name: Android CI
    # Android builds fine on the macOS image (SDK preinstalled). Switch to
    # `linux_x2` to save macOS minutes if your plan includes Linux instances.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    cache:
      cache_paths: *gradle_cache
    scripts:
      - *prepare_gradle
      - *android_sdk
      - name: Unit tests — all modules
        # testDebugUnitTest is the classic com.android.library task name; KMP androidLibrary
        # modules (:core:network, :core:security, :core:serverapi, …) run their Android unit
        # tests under testAndroidHostTest instead — Gradle only runs a task in the modules
        # that actually declare it, so both names are needed or those modules' tests
        # silently don't run at all (no error, just skipped).
        script: ./gradlew testDebugUnitTest testAndroidHostTest
      - name: Assemble debug APK
        script: ./gradlew :app:assembleDebug
      - name: Assemble release — unsigned (proves R8 + resource shrinking)
        script: ./gradlew :app:assembleRelease -PallowUnsignedRelease
    artifacts:
      - app/build/outputs/**/*.apk
      - "**/build/reports/tests/**"
      - "**/build/test-results/**/*.xml"

  # ───────────────────────────────────────────────────────────────────────────
  # DORMANT — no `triggering` block, so it only runs when started by hand
  # (Codemagic UI → Start new build → android-release) or via the API.
  # Enable the tag trigger once the `android_signing` group is filled in.
  android-release:
    name: Android release (signed)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - android_signing
    # triggering:
    #   events: [tag]
    #   tag_patterns:
    #     - pattern: "v*"
    #       include: true
    cache:
      cache_paths: *gradle_cache
    scripts:
      - *prepare_gradle
      - *android_sdk
      - name: Restore the signing keystore
        script: |
          set -eo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > "$CM_BUILD_DIR/app/release.keystore"
          cat > "$CM_BUILD_DIR/keystore.properties" <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build signed APK + AAB
        script: ./gradlew :app:assembleRelease :app:bundleRelease
      - name: Print signing certificate (sanity check)
        script: |
          set -eo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/mapping.txt

  # ───────────────────────────────────────────────────────────────────────────
  # Validates the iOS side of the port as it lands: compiles every KMP module's
  # iOS target, builds the iosApp, and screenshots the shared UI on a phone + a
  # tablet. Runs on `main`, PRs into it, and `spike/*`. Informational for now;
  # make it a required check at the Phase 2 milestone (UI running on iOS).
  ios-ci:
    name: iOS CI
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      java: 17
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: "spike/*"
          include: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData
    scripts:
      - *prepare_gradle
      - name: Detect how far the port has got
        script: |
          KMP_MODULES=$(find . -maxdepth 4 -path '*/src/commonMain' -type d | wc -l | tr -d ' ')
          echo "KMP modules: $KMP_MODULES ; shared/=$( [ -d shared ] && echo yes || echo no ) ; iosApp/=$( [ -d iosApp ] && echo yes || echo no )"
          if [ "$KMP_MODULES" = "0" ] && [ ! -d shared ]; then
            echo "No commonMain source sets yet — nothing to build."
            exit 0
          fi
      - name: Compile every KMP module for iOS (simulator, arm64)
        script: ./gradlew compileKotlinIosSimulatorArm64 --continue
      - name: Run iOS unit tests where they exist
        script: |
          if ./gradlew help --task iosSimulatorArm64Test > /dev/null 2>&1; then
            ./gradlew iosSimulatorArm64Test --continue
          else
            echo "No iOS test tasks yet (tests still JVM-only) — skipping."
          fi
      - name: Build the iOS app and render it on a phone + a tablet
        script: |
          set -eo pipefail
          if [ ! -d iosApp ]; then
            echo "iosApp/ not present yet — skipping xcodebuild."
            exit 0
          fi
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd iosApp && xcodegen generate)

          xcrun simctl list devices available
          # Resolve by name substring so the chip/size suffix doesn't matter.
          resolve() { xcrun simctl list devices available | grep -m1 "$1" | grep -oE "[0-9A-F]{8}-[0-9A-F-]{27}"; }
          PHONE=$(resolve "iPhone 17"); PHONE=${PHONE:-$(resolve "iPhone")}
          TABLET=$(resolve "iPad Air 11-inch"); TABLET=${TABLET:-$(resolve "iPad")}
          echo "phone=$PHONE tablet=$TABLET"

          # Build against a concrete simulator so embedAndSignAppleFrameworkForXcode
          # gets a single arch (arm64) it can map to :shared's iosSimulatorArm64 —
          # a `generic` destination hands it arm64+x86_64 and it can't pick one.
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "id=$PHONE" \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            clean build | xcbeautify

          APP=$(find build/ios/Build/Products -name "iosApp.app" -type d | head -1)
          mkdir -p build/screenshots
          for entry in "$PHONE:phone" "$TABLET:tablet"; do
            udid="${entry%%:*}"; slug="${entry##*:}"
            [ -z "$udid" ] && { echo "no $slug simulator — skipping"; continue; }
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP"
            xcrun simctl launch "$udid" net.dexxicon.reader
            sleep 6
            xcrun simctl io "$udid" screenshot "build/screenshots/shared-ios-$slug.png"
          done
    artifacts:
      - build/screenshots/*.png
      - "**/build/reports/tests/**"

  # ───────────────────────────────────────────────────────────────────────────
  # DORMANT — needs the App Store Connect integration + signing identity, and
  # a real bundle id / app id. Start by hand, or add a `v*` tag trigger later.
  ios-testflight:
    name: iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      java: 17
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "net.dexxicon.reader"   # confirm the real iOS bundle id
      # When the App Store Connect API key integration exists (Teams →
      # Integrations → App Store Connect), reference it here — this is what the
      # `publishing:` block below needs before it will validate:
      # integrations:
      #   app_store_connect: <the name you gave the integration>
      # groups:
      #   - appstore
    scripts:
      - name: Guard
        script: |
          if [ ! -d "iosApp" ]; then echo "iosApp/ not present yet."; exit 0; fi
      - *prepare_gradle
      - name: Fetch signing files
        script: |
          set -eo pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build the shared XCFramework
        script: ./gradlew :shared:assembleXCFramework
      - name: Build the .ipa
        script: |
          set -eo pipefail
          test -f iosApp/project.yml && (brew list xcodegen >/dev/null 2>&1 || brew install xcodegen) \
            && cd iosApp && xcodegen generate && cd ..
          xcode-project build-ipa --project iosApp/iosApp.xcodeproj --scheme iosApp
    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa"
    # Uncomment once `environment.integrations.app_store_connect` above is set —
    # Codemagic validates every workflow in this file (dormant ones included) and
    # rejects `auth: integration` with no integration to point at. Until then the
    # .ipa is just an artifact you can upload by hand.
    # publishing:
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: true

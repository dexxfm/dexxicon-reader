[versions]
# AGP 9.4 provides built-in Kotlin; do NOT apply org.jetbrains.kotlin.android.
# `includeBuild` convention plugins break the type-safe `libs` accessor in the first
# Android module under Gradle 9.6 / AGP 9.4, so module build files are kept flat.
# KSP2 (2.3.11) is decoupled enough to run against the built-in compiler.
agp = "9.4.0"
kotlin = "2.4.0"
ksp = "2.3.11"
compose-bom = "2026.08.00"
compose-compiler = "2.4.0"
# Compose Multiplatform — the org.jetbrains.compose plugin + its runtime libs, for :shared.
# The Compose compiler still comes from Kotlin's own plugin (compose-compiler above).
composeMultiplatform = "1.12.0"

coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigation = "2.10.0"
material3Adaptive = "1.3.0"

hilt = "2.60.1"
hiltExt = "1.4.0"

room = "2.8.4"
sqlite = "2.6.2"
datastore = "1.2.1"
work = "2.11.2"
fragment = "1.8.9"

coroutines = "1.11.0"
serialization = "1.9.0"

okhttp = "5.5.0"
retrofit = "3.0.0"
retrofitSerialization = "1.0.0"

coil = "3.6.2"
media3 = "1.11.0"
playServicesCast = "22.1.0"
mediarouter = "1.8.1"
appcompat = "1.7.1"
readium = "3.3.0"
junrar = "7.5.5"
androidPdfViewer = "3.2.8"
appauth = "0.11.1"
androidxBrowser = "1.10.0"
# iOS-only for now (KMP :core:security) — KeychainSettings backs CredentialStore there,
# since Keychain items are already encrypted at rest and need no separate app-level cipher.
multiplatformSettings = "1.3.0"
# iOS-only for now (KMP :core:network) — backs ConnectivityMonitor's iOS actual, since
# NWPathMonitor itself isn't reachable from Kotlin/Native. ktor is versioned separately below,
# for the same module's new (not yet Android-wired) Ktor HttpClient.
connectivity = "2.2.1"
ktor = "3.5.2"

# :shared's Pkce (Slice 2, issue #70) — pure-Kotlin multiplatform SHA-256 + secure random,
# so PKCE's crypto works on iOS without hand-rolled CommonCrypto/Security cinterop (same
# "prefer a mature library over cinterop" call as ConnectivityMonitor's dev.jordond.connectivity).
kotlincryptoHash = "0.8.0"
kotlincryptoRandom = "0.6.0"

junit = "4.13.2"
androidxTestExt = "1.3.0"
espresso = "3.7.0"
turbine = "1.2.1"
mockwebserver = "5.5.0"
robolectric = "4.16"
truth = "1.4.5"
benchmark = "1.5.0-rc02"
baselineprofile = "1.5.0-rc02"
profileinstaller = "1.4.1"
uiautomator = "2.3.0"
androidxTestRunner = "1.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
androidx-compose-material3-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "material3Adaptive" }
androidx-compose-material3-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "material3Adaptive" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
# JetBrains' Kotlin Multiplatform fork of navigation-compose — same API, iOS-capable.
navigation-compose-multiplatform = { module = "org.jetbrains.androidx.navigation:navigation-compose", version = "2.9.2" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltExt" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hiltExt" }
hilt-ext-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltExt" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-fragment-compose = { module = "androidx.fragment:fragment-compose", version.ref = "fragment" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
# :shared's catalog UI (issue #78) — the Ktor-backed fetcher, so cover images reuse
# AppContainer's own authenticated HttpClient instead of a second, unauthenticated one, and
# so this works on iOS (coil-network-okhttp is Android/JVM-only, OkHttp has no iOS target).
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

appauth = { module = "net.openid:appauth", version.ref = "appauth" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidxBrowser" }
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }
connectivity-core = { module = "dev.jordond.connectivity:connectivity-core", version.ref = "connectivity" }
connectivity-apple = { module = "dev.jordond.connectivity:connectivity-apple", version.ref = "connectivity" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

kotlincrypto-hash-sha2 = { module = "org.kotlincrypto.hash:sha2", version.ref = "kotlincryptoHash" }
kotlincrypto-random = { module = "org.kotlincrypto.random:crypto-rand", version.ref = "kotlincryptoRandom" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-cast = { module = "androidx.media3:media3-cast", version.ref = "media3" }
play-services-cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "playServicesCast" }
androidx-mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "mediarouter" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }

readium-shared = { module = "org.readium.kotlin-toolkit:readium-shared", version.ref = "readium" }
readium-streamer = { module = "org.readium.kotlin-toolkit:readium-streamer", version.ref = "readium" }
readium-navigator = { module = "org.readium.kotlin-toolkit:readium-navigator", version.ref = "readium" }
readium-opds = { module = "org.readium.kotlin-toolkit:readium-opds", version.ref = "readium" }
readium-adapter-pdfium = { module = "org.readium.kotlin-toolkit:readium-adapter-pdfium", version.ref = "readium" }
junrar = { module = "com.github.junrar:junrar", version.ref = "junrar" }
# Pin matches what readium-adapter-pdfium-navigator resolves transitively today — bump this
# alongside any `readium` version change, or PDFView's canScrollHorizontally() (used for the
# zoomed-page-turn edge check) risks resolving to a mismatched copy of the class.
android-pdf-viewer = { module = "com.github.marain87:AndroidPdfViewer", version.ref = "androidPdfViewer" }
# readium-navigator's comic reader (R2ViewPager) extends this, so it's already on the
# classpath transitively — declared explicitly so ComicReaderScreen can raise its
# offscreenPageLimit (Readium never sets one, so it defaults to 1 page of readahead).
androidx-viewpager = { module = "androidx.viewpager:viewpager", version = "1.0.0" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "compose-compiler" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
androidx-room = { id = "androidx.room", version.ref = "room" }
# No version: AGP is already on the shared plugin classpath via com.android.application.
android-test = { id = "com.android.test" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }

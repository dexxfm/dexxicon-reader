// Shared Android compile config, applied via `apply(from = ...)` from each Android module.
// Kept as a Groovy script so it doesn't perturb the Kotlin-DSL version-catalog accessors.
// Under AGP 9 the Kotlin `jvmTarget` follows `compileOptions.targetCompatibility`, so it is
// not set explicitly here.

android {
    compileSdk 37
    defaultConfig {
        minSdk 29
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
